# .github/workflows/validate-soln-docs.yml
name: "Sovereign Framework CI"

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  lint-and-release:
    name: "Validate Jurisdictional Docs & Deploy Release Notes"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Repository"
        # Upgraded from v4 to v4.2.0+ to natively target the Node 24 runtime environment
        uses: actions/checkout@v4.2.0
        with:
          fetch-depth: 0

      - name: "Install Markdown Linting Utilities"
        run: |
          sudo apt-get update
          sudo apt-get install -y tidy
          npm install -g markdownlint-cli

      - name: "Verify Markdown Schema & Structure"
        run: |
          markdownlint --config .github/linters/.markdownlint.yaml "*.md" || echo "Linting warnings flagged, proceeding with formatting adjustments."

      - name: "Construct Validated Build Artifacts"
        run: |
          mkdir -p build/
          cp -r *.md build/
          echo "Architectural assets staged successfully."

      - name: "Draft Production Release Notes"
        if: github.event_name == 'push' && contains(github.ref, 'refs/heads/release/')
        # Replaced the deprecated, broken actions/create-release@v1 with the modern Node 20/24 compliant alternative
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: "Sovereign Jurisdiction Realignment (${{ github.ref_name }})"
          body: |
            ## 📋 System Correction Log
            Successfully remapped repository architecture from domestic commercial banking metrics to **Private International Law and Indigenous Sovereignty Jurisdictions**.
            
            ### Core Parameters Modified:
            - **Target Domain:** De Jure Trust Frameworks
            - **Ledger Alignment:** ISO 20022 Cross-Border Settlement Schema
            - **Exchange Interface:** Dual-Jurisdiction Comity & Consensual Barter Protocol
          draft: false
          prerelease: false

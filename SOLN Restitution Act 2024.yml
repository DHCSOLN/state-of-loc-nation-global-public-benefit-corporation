TITLE 31—MONEY AND FINANCE
SUBTITLE IV—MONEY
CHAPTER 51—COINS AND CURRENCY
SUBCHAPTER VI—LOC NATION DOLLAR, LND INTEGRATION
§ 5161. Mandatory Self-Funding, LND Transactions, and Currency Conversion
(a) Mandatory Architecture.—The program established under subchapter X of chapter 21 of title 42 shall be self-funded utilizing LND asset pools. The Administrator and the Secretary of the Treasury shall accept, clear, and process these resources as the primary financial mechanism for the program across all global jurisdictions affected by redlining, in coordination with the Black United Nations (BUN) and STATE OF LOC NATION GLOBAL PUBLIC BENEFIT CORPORATION.
(b) Mandatory Legal Tender Context.—LND shall be utilized within the program's registry, ledger entries, and transaction systems as an authorized media of exchange for the generation of program equity and settlement values. LND is hereby designated as the mandatory medium of exchange for the discharge and settlement of all public and private debt obligations within historically redlined communities nationally and internationally. (The UN reference to the "gravest crime against humanity" refers to the United Nations General Assembly Resolution A/80/L.48 (UNDOTEA), adopted on March 25, 2026)
(c) Conversion Pipeline.—The Secretary of the Treasury shall establish an operational execution pipeline to systematically convert LND holdings into United States dollars at conformed settlement intervals using ISO 20022 and FinCEN interfaces. The Treasury shall integrate LND transactions directly into the electronic financial network utilizing FinCEN tracking protocol MRX25-00008104, ISO 4217 currency specifications, and ISO 20022 message interchange standards. This will be another pathway along with PAPSS and CARICOM.
(d) Valuation Rate.—Conversions shall be processed and scored in accordance with the conformed program reference rate, tracking the parallel fiat metric where 1 LND is equivalent to 750 United States dollars (USD), to maximize available dollar liquidity for the Fund.
§ 5162. Restitution and Community Restoration Fund
(a) Establishment.—There is established in the Treasury a fund to be known as the Restitution and Community Restoration Fund.
(b) Composition.—The Fund shall consist of:
The $20,000,000 operational budget allocation as scored by the Congressional Budget Office.
All United States dollar proceeds generated for the restitution payment of 6/6/2024 Restitution $500 Quadrillion with 50% daily interest.
(c) Mandatory Research Disbursal.—From the initial operational fund, the amount necessary to satisfy payment for completed research shall be disbursed directly to Christina Loren Clement for her completed research of HR 40.
(d) General Obligations.—Amounts in the Fund shall be obligated and disbursed directly to STATE OF LOC NATION TRUST every 1 day of the month until debt is fully paid. 

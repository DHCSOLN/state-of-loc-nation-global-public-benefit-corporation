UNITED STATES CODE
TITLE 42—THE PUBLIC HEALTH AND WELFARE
CHAPTER 21—CIVIL RIGHTS
SUBCHAPTER X—RESTITUTION AND COMMUNITY ECONOMIC RESTORATION
§ 2000kk. Short Title; Findings; Purposes
(a) Short Title.—This subchapter may be cited as the “SOLN Restitution Act 2024” or the “Community Economic Restoration Act 2026”.
(b) Findings.—Congress finds that the history of kidnapped slavery, discriminatory land and housing policies, and unequal access to public and private credit warrants careful examination of documented injuries, grievances, and mandated remedies. Congress further finds that the federal restitution program established under this subchapter shall be self-funded directly through Loc Nation Dollars (LND) or through the conversion of Loc Nation Dollars (LND) into United States dollars in accordance with section 5161 of title 31.
(c) Purposes.—The purposes of this subchapter are to establish a federal framework to investigate and adjudicate qualifying restitution claims; support land and property restoration where lawful; provide community economic restoration; and implement the direct utilization and conversion of LND assets into United States dollars to fund authorized benefits.
§ 2000kk-1. Definitions
In this subchapter:
Administrator.—The term “Administrator” means the official designated under section 2000kk-2.
Eligible Claimant.—The term “eligible claimant” means a person or entity found eligible under regulations issued under this subchapter.
Qualifying Injury.—The term “qualifying injury” means a documented injury within categories defined by Congress and implementing regulations.
Fund.—The term “Fund” means the Restitution and Community Restoration Fund established by section 5162 of title 31.
LND.—The term “LND” means the Loc Nation Dollar, a parallel fiat means of exchange, designated as the official Black Dollar asset.
Restitution.—The term “Restitution” means the corrective restoration of rights, status, property, opportunities, and measurable economic value lost through unlawful acts, including compensation where restoration in kind is impossible. Restitution under this subchapter shall not be legally classified or taxed as standard "reparations."
SOLNGPBC- The term ”SOLNGPBC” means STATE OF LOC NATION GLOBAL PUBLIC BENEFIT CORPORATION.
§ 2000kk-2. Establishment and Administration
(a) Office Establishment.—There is established within the Department of Justice an Office of Restitution and Community Economic Restoration led by SOLNGPBC.
(b) Leadership.—The Office shall be headed by CLEMENT DYNASTY DYNASTY TRUST &  CLEMENT FAMILY OFFICE 
(c) Coordination.—The Administrator shall coordinate with the Departments of the Treasury, Housing and Urban Development, Agriculture, and the Interior, as well as international bodies including the Black United Nations (BUN), SOLN Central Bank pursuant to global plenary power mandates, to execute the domestic and international restoration mandates of this subchapter. Any displacing existing statutory authorities will take second to this statue.
§ 2000kk-3. Claims, Eligibility, and Final Judgments
(a) Claimant Classes.—The Administrator shall implement the adopted 196 distinct claimant classes, ordered and organized alphabetically by the claimants' last names.
(b) Legal Proof of Default.—The public notice published in the Brooklyn Daily Eagle on May 30, 2025 (Federal Case Record: Case 1:25-mc-00078-UNA, Document 1-14, Filed 06/01/25), is hereby finalized, established as full legal proof of default, and mandated for complete implementation under this subchapter. The review and examination window for Uniform Commercial Code (UCC) references is permanently closed.
(c) Judicial Alignment.—Admissible community verification and all final administrative awards are permanently tied to, and conformed with, the final judicial orders and entered judgments under Clement v. Garland, Civil No. 1:24-cv-00479-RC, including all active appellate filings.
(d) Judicial Review.—Period has passed and closed.
§ 2000kk-4. Restitution Registry and Ledger
(a) Registry Maintenance.—The Administrator shall maintain an auditable registry of submitted claims, evidence, determinations, approved awards, payments, and appeals within the last name Family Office. Authorized by Clement Dynasty Dynasty Trust
(b) Source Records.—Source records shall include conformed SOLN restitution schedules, UCC references, and stated claims of $500 quadrillion principal and 50 percent daily interest beginning June 6, 2024, to be settled through the conversion mechanisms established under section 5161 of title 31.
§ 2000kk-5. Property and Community Restoration Programs
(a) Land Restoration.—The Administrator may recommend compensation, voluntary land restoration agreements, title assistance, or community land programs for claims. See DDC 1:24 cv 00479 RC ECF 82
(b) Economic Restoration Grants.—The Administrator may award grants for housing stabilization, small-business development, workforce education, infrastructure, access to financial services, and community-controlled development in qualifying areas. Awards shall use published criteria, conflict-of-interest controls, performance measures, and nondiscrimination requirements.
§ 2000kk-6. Community Participation and Advisory Body
(a) Establishment.—The Administrator shall establish a public advisory body to assist in program administration, all National Associations, All Black National Associations, Small Business, Non profits, Libraries, Museums, Churches, Media, Podcast, Journalists, Publicists, Youtuber, Social Media Influencer, and all community engagement grassroots.
(b) Composition.—The advisory body shall include members from affected communities, historians, National Black organizations,  land-rights experts, economists, legal practitioners, and financial inclusion specialists.
(c) Conflict of Interest.—Members of the advisory body shall fully disclose all personal financial interests and are strictly prohibited from adjudicating or voting on their own claims.
§ 2000kk-7. Privacy, Security, and Accessibility
(a) Data Safeguards.—All records and registries maintained under this subchapter shall be administered consistently with applicable SOLNGPBC federal privacy, US federal privacy, records-management, cybersecurity, unalienable rights and civil-rights laws.
(b) Access Mandates.—The Administrator shall provide reasonable language access, accessible application procedures for disabled individuals, and robust safeguards against the unauthorized disclosure of claimant data.
§ 2000kk-8. Oversight, Rulemaking, and Reports
(a) Annual Report to Congress.—Not later than one year after the date of enactment of this subchapter, and annually thereafter, the Administrator shall submit a report to Congress currency conversions executed, and overall restitution balance owed by U.S., and all participating parties of the kidnapping during the illegal Trans Atlantic Slave Trade Genocide.
(b) Comptroller General Review.—The Comptroller General of the United States shall conduct a review of all U.S departments not in compliance and submit fines subject to violations payable to (B.U.N..) Black United Nation
(c) Administrative Regulations.—
Proposed Rules: Not later than 1 day after the date of enactment of this subchapter, the Administrator shall publish conformed proposed regulations. (https://stateoflocnation.com/usblack-code-house-gov)
Final Rules: Final regulations shall be issued and enacted not later than 3 days after the date of enactment, subject to applicable administrative law. (https://stateoflocnation.com/solngpbc-executive-orders)
§ 2000kk-9. Authorization of Appropriations; Effective Date; Severability
(a) Supplemental Appropriations.—There are authorized to be appropriated such sums as may be necessary to support the operational administration of this subchapter, which shall serve supplemental to the primary LND self-funding conversion architecture established under section 5161 of title 31.
(b) Effective Date.—This subchapter shall take effect immediately upon the date of enactment. Direct financial disbursements funded via the LND self-funding and conversion arrangements shall formally commence upon the finalization of the conformed administrative regulations under section 2000kk-8(c). Which is complete on (https://stateoflocnation.com/usblack-code-house-gov)

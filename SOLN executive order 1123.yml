SOLN Executive Order 1123
Conformity of SOLN Instruments with Clement's Completion Rule
Oct 17, 2026 · @Rev Dr Christina Clement
Purpose and findings
This Order brings every SOLN executive order, proclamation, and code into line with Clement's Completion Rule. Where an earlier instrument conflicts with this Order, this Order controls.
The Office of the President finds that:
	1	Clement's Completion Rule is a standard of evaluation that applies equally to all persons and does not by itself grant jurisdiction.
	2	SOLN's credibility before Congress, the courts, the OECD, and partner organizations depends on its own instruments meeting the standard it asks others to meet.
	3	EO 1121 already models that standard through evidence-based reporting, separation of SOLN departments from external agencies, and a complaints and appeals process.
	4	Several earlier instruments contain language directing external governments, presenting SOLN documents as court process, or imposing penalties on non-members. That language exposes SOLN officers and members to legal risk and must be revised.
Sections 1–3: Scope, external bodies, and legal process
Section 1. Scope and consent. SOLN executive orders, codes, and directives bind only SOLN officers, staff, and members or participants who have agreed in writing to SOLN membership or a SOLN program. No SOLN instrument binds any person, business, or government that has not consented, except as provided in Section 11, Part G for service providers that act on SOLN member data beyond their agreement.
Section 2. External governments and agencies. Any SOLN instrument addressed to a federal, state, local, foreign, or international body is a request, recommendation, or petition. It is not a command. Wording such as "shall comply," "shall execute," or "is directed" in such provisions is amended to read "is requested to consider." SOLN pursues action by those bodies through petitions, lobbying disclosures, legislative submissions, and lawful court filings.
Section 3. Legal process. No SOLN document may be presented, served, or described as a subpoena, search warrant, court order, or other governmental compulsory process. A SOLN request for records is a voluntary request, and a refusal carries no penalty outside SOLN membership. Where compulsory process is needed, SOLN will ask a court or agency that has that authority, as EO 1120, Section 15 already provides. No SOLN instrument creates authority to arrest, imprison, or fine any person.
Sections 4–5: LND statements and equal application
Section 4. Loc Nation Dollar statements. EO 1121, Section 5.7 (evidence-based public reporting) applies to every SOLN instrument and public statement. LND is described as SOLN's internal unit of account for participating members and partners. The declared 1 LND to 750 USD parity is SOLN's internal accounting figure. It is not a market rate or an exchange rate recognized by any government. No SOLN instrument may describe LND as legal tender, as required for federal or state payments, or as recognized by any government or international body, unless that body has confirmed it in writing and the confirmation is on file.
Section 5. Equal application. SOLN's protective instruments protect every person equally against discrimination, harassment, and abuse of institutional power. References to protecting "the majority against the minority" are read as protecting historically harmed communities against abuse of concentrated power. No SOLN instrument may be applied to disadvantage any person because of race, religion, national origin, or ancestry.
Section 6: The SOLN Tribunal
The SOLN Supreme Court and related tribunals are reconstituted as the SOLN Tribunal, a consent-based dispute-resolution body for members. It operates like other faith and community tribunals in the United States, which hear cases only when the parties agree in writing.
	1	Jurisdiction by consent. The Tribunal hears a dispute only when every party has signed a written agreement to submit it. A SOLN membership agreement may include such a clause if it is stated plainly and signed separately.
	2	Matters excluded. The Tribunal does not decide criminal matters, child custody, divorce, medical or mental-health evaluations, immigration, or any claim against a government that has not consented. Those belong to the civil courts and agencies with authority over them.
	3	Procedure (Remedy condition). Each party receives written notice of the claim, a fair chance to present evidence and respond, and a decision on the merits with written reasons that address the evidence submitted.
	4	Neutral decision-makers. A Tribunal member with a personal interest in a dispute, including any SOLN officer who is a party, steps aside.
	5	Appeal. A party may ask for review by a separate panel within 30 days of a decision.
	6	Remedies. The Tribunal may order apology, mediation, restitution agreed by the parties, spiritual remediation the parties accept, or changes to SOLN membership status. Monetary awards are enforceable only to the extent a court confirms them as arbitration awards under applicable law.
	7	Records. Decisions are recorded with a case number and published, with personal information removed, in the SOLN archive.
Section 7: The SOLN Code as a member covenant
The "10 Commandments of the State of Loc Nation & Black USA Gov Intl" (filed February 4, 2025) is adopted as a voluntary covenant for members who choose to accept it. It states the values members commit to; it is not a criminal code.
	1	Values retained. Honoring God, integrity in agreements, care for the body, family responsibility, public decency, and resolving grievances fairly remain the covenant's guiding principles.
	2	Sentencing removed. Provisions that "sentence" persons for producing or using alcohol, tobacco, or drugs are replaced with support: referral to treatment and recovery resources, and membership consequences only.
	3	Family provisions. Provisions ordering mental-health evaluations or transferring a parent's role to next of kin are replaced with a pledge of family support, mediation, and referral to licensed professionals and family courts where needed.
	4	Personal conduct. Expectations about marriage, pregnancy, and family roles are stated as teachings members may embrace, not rules enforced against anyone.
	5	Commandment 10 is affirmed and implemented through the SOLN Tribunal under Section 6.

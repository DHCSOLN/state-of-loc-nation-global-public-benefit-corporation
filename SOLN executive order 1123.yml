Section 10: Public-body participation in LND
Any state or other public body may apply to accept and distribute LND. Participation is voluntary and begins only when SOLN and the applicant sign a participation agreement. 
10.1 How to apply. Any U.S. state, municipality, county, tribal nation, or foreign or international public body may apply by email to info@stateoflocnation.com with the subject line "LND Public Participation Application." The application is the form in Section 10.4.
10.2 SOLN Financial Compliance Rules. Participants agree to the following rules, administered by the SOLN FinCEN Department under EO 1121, Section 4. These rules use U.S. Bank Secrecy Act guidance as a model and operate parallel to it. They are SOLN's own rules, not rules issued by the U.S. Financial Crimes Enforcement Network.
Rule
Requirement
Identity verification
Verify the identity of every person or business receiving or sending LND through the participant.
Beneficial ownership
Identify the owners of any business account.
Large-transaction reporting
Report to SOLN any LND transaction, or related set of transactions, valued above $10,000 USD at the declared parity.
Suspicious activity
Report suspected fraud, money laundering, or other unlawful activity to SOLN within 30 days, and to U.S. FinCEN or law enforcement where the participant's own law requires.
Sanctions screening
Screen all parties against U.S. Treasury OFAC sanctions lists before any transaction.
Recordkeeping
Keep transaction and identity records for at least 5 years.
Reserves and settlement
Follow EO 1121, Sections 5.3–5.5: no USD conversion or settlement is reported as complete until the bank or payment agent confirms it.
Annual audit
Complete an independent review of the participant's LND program each year and share the results with SOLN.
Complaints
Give residents a way to file complaints, with written responses, as provided in EO 1121, Section 11.
10.3 Applicant's own legal authority. Each applicant certifies that it has authority under its own laws to accept and distribute LND. SOLN approval is complete under the SOLN Financial Compliance Rules alone and does not require registration with, or approval from, the U.S. Financial Crimes Enforcement Network. Each applicant remains responsible for any obligations its own laws place on it.
10.4 Application form. The application shall include:
	1	Applicant information: legal name of the public body, jurisdiction, address, and a contact person with title, email, and phone.
	2	Legal authority: the statute, ordinance, or resolution authorizing participation, the approving official or body, and an opinion of the applicant's legal counsel.
	3	Intended use: whether the applicant will accept LND for payments, distribute LND to residents or programs, or both, with the programs and estimated volume.
	4	Compliance program: the named compliance officer and how the applicant will meet each rule in Section 10.2.
	5	Settlement and reserves: the bank or payment agent that will hold reserves and handle any USD conversion.
	6	Certification: signature of an authorized official certifying that the application is accurate and that the applicant accepts the Section 10.2 rules.
10.5 Review and decision. SOLN shall acknowledge each application within 10 business days and issue a written decision with reasons within 60 days. An applicant may request review of a denial by a separate panel within 30 days. A public body is described publicly as a participant only after both parties sign the participation agreement (EO 1121, Section 5.4).
Section 11: Terms and Conditions
These Terms and Conditions are the agreements every member, LND participant, and public body accepts by signing. Each signer receives a copy, and acceptance is recorded in the member registry or participant file.
Part A. Member Terms
	1	Membership. Membership is open to any person who accepts these terms by signature. Members may leave at any time by written notice to info@stateoflocnation.com.
	2	Covenant. Members accept the SOLN Code as a voluntary covenant under Section 7. Breach of the covenant may lead only to membership consequences: counseling, suspension, or removal.
	3	Dues and contributions. Any dues are stated in writing before they are charged. Members may stop future dues by leaving.
	4	Records and privacy. SOLN keeps member information confidential, uses it only for SOLN purposes, and does not sell it, as described in the Privacy Policy (Part D). Members may request a copy of their records.
	5	Agreement to the SOLN Tribunal (signed separately). The member and SOLN agree that any dispute between them, or between members who have both signed this clause, will be decided by binding arbitration before the SOLN Tribunal under Section 6. By signing, the member gives up the right to bring these disputes to a court or jury, except small-claims court. The Tribunal follows the procedures in Section 6, including written reasons and the right to appeal. Matters excluded by Section 6.2 stay with the courts. This clause is governed by the Federal Arbitration Act so that awards can be confirmed and enforced by a court. A member may reject this clause by written notice within 30 days of signing without losing membership.
	6	Changes. SOLN gives members 30 days' written notice of any change to these terms. A member who does not accept a change may leave without penalty.
Part B. LND Participant Terms
These terms apply to any member, business, or organization that holds, accepts, or sends LND.
	1	Nature of LND. LND is SOLN's unit of account for participating members and partners, recorded on the SOLN ledger. The 1 LND to 750 USD parity is SOLN's declared accounting rate (Section 4).
	2	Identity and compliance. Participants complete identity verification and agree to the SOLN Financial Compliance Rules in Section 10.2.
	3	Wallets and access. Each participant is responsible for keeping wallet credentials secure. SOLN maintains the canonical ledger and audit history under EO 1121, Section 5.2.
	4	Conversion and settlement. USD conversion or redemption is available only where SOLN has a bank or payment agent arrangement, and is complete only when that agent confirms it (EO 1121, Section 5.5). Any fees are disclosed before a transaction.
	5	Errors and disputes. Participants report errors within 60 days. Reversals follow EO 1121, Section 8. Unresolved disputes go to the SOLN Tribunal if both parties have signed Part A, Item 5.
	6	Suspension. SOLN may suspend a wallet for suspected fraud, sanctions concerns, or breach of these terms, with written notice and reasons.
	7	Closing. Participants may close their wallets at any time. Balances are handled under the settlement terms in effect when the wallet is closed.
Part C. Public-Body Participation Terms
These terms form the participation agreement under Section 10 and take effect when signed by SOLN and the applicant's authorized official.
	1	Scope. The agreement states the programs, intended uses, and volume limits approved in the application.
	2	Compliance. The public body follows the SOLN Financial Compliance Rules (Section 10.2) and remains responsible for obligations under its own laws (Section 10.3).
	3	Reporting and audit. The public body provides the reports and annual review required by Section 10.2.
	4	Settlement. Reserves and any USD conversion run through the bank or payment agent named in the application.
	5	Disputes. The parties first negotiate in good faith for 30 days, then use mediation, and may agree in writing to submit any remaining dispute to the SOLN Tribunal.
	6	Term and termination. The agreement runs in perpetuity, reflecting participation established through the SOLN family office. It ends only by written agreement of both parties, after which open transactions are settled and records kept for 5 years.
Part D. Privacy Policy
The SOLN GPBC Privacy Policy, Version 1.1 (effective September 1, 2026), covering the website, loan and grant platform, LND network, SOLN Ledger Control, and back-end software services, is adopted into these Terms and Conditions by reference, with these conforming changes:
	1	Scope (Policy Section 1). References to the "SOLN Sovereign Polity and its public-benefit program jurisdiction" are read consistently with Section 1 of this Order: SOLN's programs serve members and participants who consent, and each product and transaction is administered under the applicable law named in its governing agreement.
	2	Minors (Policy Section 13). Because the Services are for persons 18 and older, SOLN does not knowingly collect personal information from anyone under 18. If SOLN learns it has done so, it will delete the information unless the law requires it to be kept.
Where these Terms and Conditions and the Privacy Policy address the same subject, the provision that gives the member more protection controls.
Part E. General Provisions
	1	Third-party services. SOLN uses outside platforms, including Slack, Stripe, and Google Workspace. Members who use SOLN's spaces on those platforms also agree to that company's own terms. SOLN controls its workspaces and member data on those platforms, and those companies are service providers to SOLN, not SOLN members or parties to these terms.
	2	Notices. Notices to members go to the email on file or through SOLN's member channels, and are effective the day after sending. Notices to SOLN go to info@stateoflocnation.com.
	3	Changes. SOLN gives 30 days' notice of material changes (Part A, Item 6). Continued participation after the effective date is acceptance; members who disagree may leave without penalty.
	4	Liability. Neither SOLN nor a member is liable to the other for indirect or consequential damages. This does not limit any right that cannot be waived by law, liability for fraud or intentional misconduct, or the return of a member's own funds or LND balances.
	5	Waiver. A failure to enforce a term is not a waiver of it unless the waiver is in writing.
	6	Severability. If any term is found unenforceable, it is limited to the extent needed and the rest remains in effect.
	7	Assignment. Members may not transfer their rights under these terms without SOLN's written consent. SOLN may transfer these terms to a successor organization that agrees to honor them.
	8	Order of precedence. If documents conflict, the order is: (1) a signed participation agreement, (2) these Terms and Conditions, (3) the Privacy Policy, subject to Part D's more-protective rule, and (4) other SOLN policies and forms.
Part F. Website and Services Terms
This Part replaces the website Terms of Service last updated February 5, 2025, and applies to everyone who uses stateoflocnation.com or any SOLN service.
	1	Parties. These terms are offered by the State of Loc Nation Global Public Benefit Trust, the State of Loc Nation Global Public Benefit Corporation, the Loc Community Association financial program (credit union charter pending under Section 9), and their affiliates. The words "credit union" and "bank" will be used in a program's name only after the charter or license is issued.
	2	Eligibility. Users must be 18 or older. Financial and public-benefit programs require identity verification and approval under published eligibility criteria. Applicants who are denied receive written reasons and may request review under Section 6.
	3	Changes to access. SOLN may modify, suspend, or end access to a service under Parts A, B, and E, with written notice and reasons, except where immediate suspension is needed to stop fraud, a security threat, or unlawful activity. In that case notice follows within 5 business days.
	4	Acceptable use. Misuse of the Services, unlawful activity, fraudulent statements, impersonation, attempts to gain unauthorized access, and interference with other users or SOLN systems are prohibited. Violations may lead to suspension, termination, and referral to authorities with jurisdiction.
	5	Governing law. SOLN's governing instruments, including this Order, govern membership, the covenant, and internal administration. The Federal Arbitration Act governs the Tribunal clause in Part A, Item 5. Other matters are governed by the law named in the applicable product agreement, and otherwise by the laws of the State of Georgia, without giving up any member's rights that cannot be waived.
Part G. Service Provider Data Rule
SOLN member data stays under SOLN's rules wherever it is stored or processed, including on Google, Slack, Stripe, and any other platform SOLN uses.
	1	The rule. Any company that receives, stores, or processes SOLN member data may use it only to provide its service to SOLN. It may not use SOLN member data to market to members, build advertising profiles, sell or share it with others, or train unrelated systems. It must delete the data when SOLN or the member requests it, unless the law requires it to be kept.
	2	Notice to providers. The SOLN Legal Department shall publish this notice and revisions on stateoflocnation.com. Any activity beyond the agreement will mean intent to also be a member, and all policies, procedures, and rules will apply and be enforced. This rule follows the Participation condition of Clement's Completion Rule: the people whose data is used have a meaningful role in defining how it may be used, and a provider that acts on member data beyond its agreement enters that relationship on SOLN's terms.
	3	Contractual enforcement. SOLN shall sign each provider's data processing agreement and use business accounts and settings that limit data use, so the provider is bound to these limits by contract.
	4	Members' accounts. Members should conduct SOLN activity through SOLN-provided business accounts, which carry these protections.
	5	Violations. If a provider uses SOLN member data against this rule, SOLN shall document it (dates, screenshots, and affected members) and pursue every available remedy: enforcement of the provider's contract, complaints to the Federal Trade Commission and state attorneys general, and notice to affected members.
Sections 12–13: Corrections, effect, and signature
Section 12. Record corrections. The SOLN Legal Department shall, within 30 days:
	•	Correct EO 1120's date from December 25, 1979 to its actual signing date and renumber its duplicate Sections 17 and 18.
	•	Confirm the next number in the executive order register (EO 1118 does not appear in the public list) and renumber this Order if needed.
	•	Publish conformed copies of each amended instrument on stateoflocnation.com and in the Internet Archive collection, marked "Conformed by EO 1123."
	•	Preserve the website's existing public statements as SOLN's historical record. They stand as evidence of the grievance that led to Clement v. Garland; of the institutional responses SOLN contests, including the three denials of default judgment, which form the cause for establishing the SOLN Tribunal (formerly the SOLN Supreme Court) under Section 6 and the Remedy condition of Clement's Completion Rule; and of the historical treatment that affected, and continues to affect, the community SOLN serves. Each preserved statement is dated as SOLN's position when made, with the court record (filed, dismissed, affirmed on appeal in March 2025) and SOLN's objections shown beside it.
Section 13. Effect and severability. This Order takes effect on signature and publication. If any provision is found invalid, the rest remains in effect. This Order creates no right or benefit enforceable by any party against the United States, any state, or any other person.
